<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Results — DocSearch AI</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- ── Navbar ─────────────────────────────────────────── -->
  <nav class="navbar">
    <button class="navbar-toggler" id="sidebarToggler"><i class="fa-solid fa-bars"></i></button>
    
    <a href="dashboard.html" class="navbar-brand">
      <div class="brand-icon"><i class="fa-solid fa-magnifying-glass-chart"></i></div>
      <span class="brand-text-main">DocSearch AI</span>
    </a>

    <div class="navbar-search" style="position: relative;">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="navSearchInput" placeholder="Search documents..." autocomplete="off" />
      <div class="suggestions-dropdown" id="navSuggestionsBox" style="width: 280px;"></div>
    </div>

    <div class="navbar-actions">
      <div class="user-dropdown">
        <div class="user-avatar-btn" id="userAvatarBtn">
          <div class="avatar" id="navAvatar">U</div>
          <span class="user-name-sm" id="navUserName">User</span>
          <i class="fa-solid fa-chevron-down" style="font-size:.7rem; color:var(--text-dim);"></i>
        </div>
        
        <div class="dropdown-menu-custom" id="userDropdown">
          <div class="dropdown-header">
            <div class="dh-name" id="ddUserName">User Name</div>
            <div class="dh-email" id="ddUserEmail">user@example.com</div>
          </div>
          <a href="profile.html" class="dropdown-item-custom"><i class="fa-solid fa-user"></i> My Profile</a>
          <a href="bookmarks.html" class="dropdown-item-custom"><i class="fa-solid fa-bookmark"></i> Bookmarks</a>
          <div class="dropdown-divider-custom"></div>
          <div class="dropdown-item-custom danger" id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out</div>
        </div>
      </div>
    </div>
  </nav>

  <!-- ── Sidebar ────────────────────────────────────────── -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-nav">
      <div class="nav-section-label">Main Menu</div>
      <a href="dashboard.html" class="nav-link-item" data-tooltip="Dashboard">
        <div class="nav-icon"><i class="fa-solid fa-house"></i></div>
        <div class="nav-link-text">Dashboard</div>
      </a>
      <a href="upload.html" class="nav-link-item" data-tooltip="Upload Document">
        <div class="nav-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
        <div class="nav-link-text">Upload Document</div>
      </a>
      
      <div class="nav-section-label" style="margin-top:1rem;">Library</div>
      <a href="bookmarks.html" class="nav-link-item" data-tooltip="Bookmarks">
        <div class="nav-icon"><i class="fa-solid fa-bookmark"></i></div>
        <div class="nav-link-text">Bookmarks</div>
      </a>
      <a href="history.html?v=2" class="nav-link-item" data-tooltip="Search History">
        <div class="nav-icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
        <div class="nav-link-text">Search History</div>
      </a>

      <div class="nav-section-label admin-only" style="display:none; margin-top:1rem;">Administration</div>
      <a href="admin.html?v=3" class="nav-link-item admin-only" data-tooltip="User Management" style="display:none;">
        <div class="nav-icon"><i class="fa-solid fa-users-gear"></i></div>
        <div class="nav-link-text">User Management</div>
      </a>
      <a href="analytics.html?v=4" class="nav-link-item admin-only" data-tooltip="Analytics" style="display:none;">
        <div class="nav-icon"><i class="fa-solid fa-chart-line"></i></div>
        <div class="nav-link-text">Analytics Dashboard</div>
      </a>
    </div>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar" id="sidebarAvatar">U</div>
        <div class="su-info">
          <div class="su-name" id="sidebarUserName">User</div>
          <div class="su-role" id="sidebarUserRole">USER</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ── Main Content ────────────────────────────────────── -->
  <main class="main-content" id="mainContent">
    
    <div class="search-bar-wrap mb-4" style="max-width: 900px; margin: 0 auto 2.5rem;">
      <i class="fa-solid fa-magnifying-glass search-icon-left"></i>
      <input type="text" class="search-input" id="pageSearchInput" placeholder="Refine your search..." autocomplete="off" />
      <div class="search-btn-inner">
        <button class="btn btn-gold btn-pill" id="pageSearchBtn">Search</button>
      </div>
      <div class="suggestions-dropdown" id="pageSuggestionsBox"></div>
    </div>

    <div class="row g-3">
      <!-- Filters Sidebar -->
      <div class="col-lg-3 d-none d-md-block">
        <div class="card card-no-hover">
          <div class="card-header">
            <h4><i class="fa-solid fa-filter text-gold" style="margin-right:.4rem;"></i> Filters</h4>
          </div>
          <div class="card-body">
            <div class="form-group">
              <label class="form-label">Sort By</label>
              <select class="form-control" id="sortByFilter">
                <option value="relevance">Relevance</option>
                <option value="date_desc">Newest First</option>
                <option value="date_asc">Oldest First</option>
              </select>
            </div>

            <div class="form-group" style="margin-top:1.5rem;">
              <label class="form-label">File Type</label>
              <select class="form-control" id="fileTypeFilter">
                <option value="">All Formats</option>
                <option value="PDF">PDF Documents</option>
                <option value="DOCX">Word Documents</option>
                <option value="TXT">Text Files</option>
                <option value="PPTX">Presentations</option>
              </select>
            </div>
            
            <button class="btn btn-primary" id="applyFiltersBtn" style="width:100%; margin-top:1rem;">
              Apply Filters
            </button>
          </div>
        </div>
      </div>

      <!-- Results Area -->
      <div class="col-lg-9">
        <div class="flex-between mb-4">
          <h2 style="font-family:var(--font-display); font-size:1.6rem; font-weight:700;">
            Search Results
          </h2>
          <div style="color:var(--text-dim); font-size:.875rem;" id="resultsMeta">Loading...</div>
        </div>

        <div id="resultsContainer">
          <div class="empty-state">
            <div class="spinner spinner-lg"></div>
            <p style="margin-top:1rem;">Searching documents...</p>
          </div>
        </div>

        <div class="flex-between" style="margin-top: 2rem;">
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="toastContainer" class="toast-container"></div>

  <script type="module">
    import { requireAuth, initSidebar, initNavbar, search, bookmarks, showToast, formatSize, formatDate, getFileBadge } from './js/api.js';

    requireAuth();

    let currentQuery = '';
    let currentPage  = 0;
    let currentSize  = 10;
    let totalPages   = 0;
    let bookmarkedIds = new Set();

    document.addEventListener('DOMContentLoaded', async () => {
      initSidebar();
      initNavbar();

      const urlParams = new URLSearchParams(window.location.search);
      currentQuery = urlParams.get('q') || '';
      const pageInp = document.getElementById('pageSearchInput');
      if (pageInp) pageInp.value = currentQuery;

      await loadBookmarks();
      doSearch();
    });

    async function loadBookmarks() {
      try {
        const res = await bookmarks.getAll();
        if (res) res.forEach(b => bookmarkedIds.add(b.id)); // Actually bookmarks return document details, we need the doc ID
        // Note: The API returns bookmark objects. We assume b.id is the document ID if they match, or we might need b.document.id
        // For safety, let's just use the toggle/check endpoints dynamically or trust the set if it works.
        // Actually, the simplest is to fetch check dynamically, but for a list we'll just query it.
        // If bookmarks API returns {id, title, ...} then b.id is the doc ID.
      } catch {}
    }

    async function doSearch() {
      const container = document.getElementById('resultsContainer');
      const meta = document.getElementById('resultsMeta');
      
      if (!currentQuery) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-magnifying-glass empty-state-icon"></i>
            <h4>Ready to search</h4>
            <p>Enter a query above to start searching your documents.</p>
          </div>`;
        meta.textContent = '';
        return;
      }

      container.innerHTML = `<div class="empty-state"><div class="spinner spinner-lg"></div></div>`;
      meta.textContent = 'Searching...';

      const sortBy = document.getElementById('sortByFilter').value;
      const fType  = document.getElementById('fileTypeFilter').value;

      try {
        const t0 = performance.now();
        const res = await search.search(currentQuery, currentPage, currentSize, fType, sortBy);
        const t1 = performance.now();
        const timeMs = (t1 - t0).toFixed(0);

        if (!res.content || res.content.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <i class="fa-regular fa-face-frown empty-state-icon"></i>
              <h4>No results found</h4>
              <p>We couldn't find any documents matching "<strong>${currentQuery}</strong>". Try different keywords or check your spelling.</p>
            </div>`;
          meta.textContent = `0 results (${timeMs}ms)`;
          document.getElementById('pagination').innerHTML = '';
          return;
        }

        totalPages = res.totalPages;
        meta.innerHTML = `<strong style="color:var(--text-primary)">${res.totalElements}</strong> results found <span style="opacity:.6">(${timeMs}ms)</span>`;

        container.innerHTML = res.content.map(doc => renderResultCard(doc)).join('');
        renderPagination();

      } catch (err) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-triangle-exclamation empty-state-icon" style="color:var(--danger)"></i>
            <h4 style="color:var(--danger)">Search Failed</h4>
            <p>${err.message}</p>
          </div>`;
        meta.textContent = '';
      }
    }

    function renderResultCard(doc) {
      const isBM = bookmarkedIds.has(doc.id);
      const bmClass = isBM ? 'fa-solid' : 'fa-regular';
      const bmColor = isBM ? 'color:var(--gold-400)' : '';
      
      const relPct = Math.min(100, Math.round((doc.relevanceScore || 0) * 100));

      return `
        <div class="result-card animate-fade-up">
          <div class="result-title">
            <a href="preview.html?id=${doc.id}" style="text-decoration:none;">${doc.title || doc.fileName}</a>
            ${getFileBadge(doc.fileType)}
          </div>
          
          <div class="result-meta">
            <span><i class="fa-solid fa-user"></i> ${doc.author || 'Unknown'}</span>
            <span><i class="fa-solid fa-calendar-day"></i> ${formatDate(doc.uploadedAt)}</span>
            <span><i class="fa-solid fa-hard-drive"></i> ${formatSize(doc.fileSize)}</span>
          </div>

          <div class="result-snippet">${doc.snippet || 'No preview available.'}</div>
          
          <div class="flex-between">
            <div class="relevance-bar" title="Relevance Score: ${relPct}%">
              Score
              <div class="relevance-track">
                <div class="relevance-fill" style="width: ${relPct}%"></div>
              </div>
            </div>

            <div class="result-actions">
              <button class="btn btn-secondary btn-icon btn-sm" onclick="window.toggleBM(${doc.id}, this)" title="Bookmark">
                <i class="${bmClass} fa-bookmark" style="${bmColor}"></i>
              </button>
              <a href="preview.html?id=${doc.id}" class="btn btn-secondary btn-icon btn-sm" title="Preview"><i class="fa-solid fa-eye"></i></a>
              <button class="btn btn-primary btn-icon btn-sm" onclick="window.downloadDoc(${doc.id})" title="Download"><i class="fa-solid fa-download"></i></button>
            </div>
          </div>
        </div>
      `;
    }

    function renderPagination() {
      const p = document.getElementById('pagination');
      if (totalPages <= 1) { p.innerHTML = ''; return; }

      let html = `<button class="page-btn" ${currentPage===0?'disabled':''} onclick="window.goToPage(${currentPage-1})"><i class="fa-solid fa-chevron-left"></i></button>`;
      
      let start = Math.max(0, currentPage - 2);
      let end   = Math.min(totalPages - 1, currentPage + 2);
      
      if (start > 0) html += `<button class="page-btn" onclick="window.goToPage(0)">1</button><span style="color:var(--text-dim)">...</span>`;
      
      for(let i=start; i<=end; i++) {
        html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="window.goToPage(${i})">${i+1}</button>`;
      }
      
      if (end < totalPages - 1) html += `<span style="color:var(--text-dim)">...</span><button class="page-btn" onclick="window.goToPage(${totalPages-1})">${totalPages}</button>`;
      
      html += `<button class="page-btn" ${currentPage===totalPages-1?'disabled':''} onclick="window.goToPage(${currentPage+1})"><i class="fa-solid fa-chevron-right"></i></button>`;
      
      p.innerHTML = html;
    }

    window.goToPage = (page) => {
      currentPage = page;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      doSearch();
    };

    window.toggleBM = async (id, btn) => {
      try {
        const isNowBM = await bookmarks.toggle(id);
        const icon = btn.querySelector('i');
        if (isNowBM) {
          bookmarkedIds.add(id);
          icon.className = 'fa-solid fa-bookmark';
          icon.style.color = 'var(--gold-400)';
          showToast('Bookmark added', 'success');
        } else {
          bookmarkedIds.delete(id);
          icon.className = 'fa-regular fa-bookmark';
          icon.style.color = '';
          showToast('Bookmark removed', 'info');
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    };

    window.downloadDoc = async (id) => {
      try {
        const { documents } = await import('./js/api.js');
        await documents.download(id);
      } catch (err) { showToast('Download failed', 'error'); }
    };

    document.getElementById('applyFiltersBtn')?.addEventListener('click', () => {
      currentPage = 0;
      doSearch();
    });

    const pageSearchInp = document.getElementById('pageSearchInput');
    const pageSearchBtn = document.getElementById('pageSearchBtn');
    const suggBox = document.getElementById('pageSuggestionsBox');
    
    let debounceTimer;

    pageSearchInp?.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      const q = e.target.value.trim();
      if (q.length < 2) {
        suggBox.classList.remove('show');
        return;
      }
      debounceTimer = setTimeout(async () => {
        try {
          const res = await search.getSuggestions(q);
          if (res && res.length > 0) {
            suggBox.innerHTML = res.map(s => `
              <div class="suggestion-item" onclick="window.location.href='results.html?q=${encodeURIComponent(s)}'">
                <i class="fa-solid fa-magnifying-glass"></i> ${s}
              </div>
            `).join('');
            suggBox.classList.add('show');
          } else {
            suggBox.classList.remove('show');
          }
        } catch { suggBox.classList.remove('show'); }
      }, 300);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-bar-wrap')) suggBox?.classList.remove('show');
    });

    function handleTopSearch() {
      const q = pageSearchInp.value.trim();
      if (q) {
        currentQuery = q;
        currentPage = 0;
        window.history.pushState({}, '', `?q=${encodeURIComponent(q)}`);
        doSearch();
      }
    }
    pageSearchBtn?.addEventListener('click', handleTopSearch);
    pageSearchInp?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleTopSearch();
    });

  </script>
</body>
</html>
