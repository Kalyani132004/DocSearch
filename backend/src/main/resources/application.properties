server.port=8080
spring.application.name=docsearch

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/docsearch_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=docsearch-secret-key-that-is-very-long-and-secure-2024-abcdefgh
jwt.expiration=86400000

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=./uploads
lucene.index-dir=./lucene-index

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.com.docsearch=INFO
