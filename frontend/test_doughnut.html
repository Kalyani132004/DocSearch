<!DOCTYPE html>
<html>
<body>
<canvas id="c"></canvas>
<script src="https://cdn.jsdelivr.net/npm/chart.js/dist/chart.umd.js"></script>
<script>
  try {
    const COLORS = ['#6366f1', '#d4a017', '#10b981', '#f43f5e', '#38bdf8'];
    new Chart(document.getElementById('c'), {
      type: 'doughnut',
      data: {
        labels: ['A'],
        datasets: [{
          data: [1],
          backgroundColor: COLORS,
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '60%',
        plugins: {
          legend: { position: 'bottom', labels: { padding: 20 } }
        }
      }
    });
    console.log('SUCCESS');
  } catch (e) {
    console.log('ERROR: ' + e.message);
  }
</script>
</body>
</html>
