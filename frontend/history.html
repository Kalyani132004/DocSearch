<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search History — DocSearch</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- ── Navbar ─────────────────────────────────────────── -->
  <nav class="navbar">
    <button class="navbar-toggler" id="sidebarToggler"><i class="fa-solid fa-bars"></i></button>
    <a href="dashboard.html" class="navbar-brand">
      <div class="brand-icon"><i class="fa-solid fa-magnifying-glass-chart"></i></div>
      <span class="brand-text-main">DocSearch</span>
    </a>
    <div class="navbar-search">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="navSearchInput" placeholder="Search documents..." autocomplete="off" />
    </div>
    <div class="navbar-actions">
      <div class="user-dropdown">
        <div class="user-avatar-btn" id="userAvatarBtn">
          <div class="avatar" id="navAvatar">U</div>
          <span class="user-name-sm" id="navUserName">User</span>
          <i class="fa-solid fa-chevron-down" style="font-size:.7rem; color:var(--text-dim);"></i>
        </div>
        <div class="dropdown-menu-custom" id="userDropdown">
          <div class="dropdown-header">
            <div class="dh-name" id="ddUserName">User Name</div>
            <div class="dh-email" id="ddUserEmail">user@example.com</div>
          </div>
          <a href="profile.html" class="dropdown-item-custom"><i class="fa-solid fa-user"></i> My Profile</a>
          <a href="bookmarks.html" class="dropdown-item-custom"><i class="fa-solid fa-bookmark"></i> Bookmarks</a>
          <div class="dropdown-divider-custom"></div>
          <div class="dropdown-item-custom danger" id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out</div>
        </div>
      </div>
    </div>
  </nav>

  <!-- ── Sidebar ────────────────────────────────────────── -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-nav">
      <div class="nav-section-label">Main Menu</div>
      <a href="dashboard.html" class="nav-link-item" data-tooltip="Dashboard">
        <div class="nav-icon"><i class="fa-solid fa-house"></i></div>
        <div class="nav-link-text">Dashboard</div>
      </a>
      <a href="upload.html" class="nav-link-item" data-tooltip="Upload Document">
        <div class="nav-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
        <div class="nav-link-text">Upload Document</div>
      </a>
      
      <div class="nav-section-label" style="margin-top:1rem;">Library</div>
      <a href="bookmarks.html" class="nav-link-item" data-tooltip="Bookmarks">
        <div class="nav-icon"><i class="fa-solid fa-bookmark"></i></div>
        <div class="nav-link-text">Bookmarks</div>
      </a>
      <a href="history.html?v=2" class="nav-link-item active" data-tooltip="Search History">
        <div class="nav-icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
        <div class="nav-link-text">Search History</div>
      </a>

      <div class="nav-section-label admin-only" style="display:none; margin-top:1rem;">Administration</div>
      <a href="admin.html?v=3" class="nav-link-item admin-only" data-tooltip="User Management" style="display:none;">
        <div class="nav-icon"><i class="fa-solid fa-users-gear"></i></div>
        <div class="nav-link-text">User Management</div>
      </a>
      <a href="analytics.html?v=3" class="nav-link-item admin-only" data-tooltip="Analytics" style="display:none;">
        <div class="nav-icon"><i class="fa-solid fa-chart-line"></i></div>
        <div class="nav-link-text">Analytics Dashboard</div>
      </a>
    </div>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar" id="sidebarAvatar">U</div>
        <div class="su-info">
          <div class="su-name" id="sidebarUserName">User</div>
          <div class="su-role" id="sidebarUserRole">USER</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ── Main Content ── -->
  <main class="main-content" id="mainContent">
    <div class="breadcrumb">
      <a href="dashboard.html">Home</a>
      <i class="fa-solid fa-chevron-right"></i>
      <span>History</span>
    </div>

    <div class="page-header flex-between flex-wrap gap-3">
      <div>
        <h2>Search History</h2>
        <p>Your recent searches and keywords.</p>
      </div>
      <button class="btn btn-danger btn-sm" id="clearHistoryBtn">
        <i class="fa-solid fa-trash-can"></i> Clear History
      </button>
    </div>

    <div class="row g-3">
      <div class="col-lg-8">
        <div class="card" style="min-height: 500px;">
          <div class="card-header">
            <h4><i class="fa-solid fa-timeline text-indigo" style="margin-right:.5rem;"></i> Timeline</h4>
          </div>
          <div class="card-body">
            <div class="timeline" id="historyTimeline">
              <div class="empty-state">
                <div class="spinner spinner-lg"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card">
          <div class="card-header">
            <h4><i class="fa-solid fa-tags text-gold" style="margin-right:.5rem;"></i> Frequent Keywords</h4>
          </div>
          <div class="card-body">
            <div id="keywordsList" style="display:flex; flex-wrap:wrap; gap:.5rem;">
              <div class="spinner spinner-sm"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="toastContainer" class="toast-container"></div>

  <script type="module">
    import { requireAuth, initSidebar, initNavbar, history, showToast, formatDateTime } from './js/api.js';

    requireAuth();

    document.addEventListener('DOMContentLoaded', () => {
      initSidebar();
      initNavbar();
      loadData();
    });

    async function loadData() {
      await Promise.all([loadHistory(), loadKeywords()]);
    }

    async function loadHistory() {
      const tl = document.getElementById('historyTimeline');
      try {
        const logs = await history.getAll();
        if (!logs || logs.length === 0) {
          tl.innerHTML = `
            <div class="empty-state" style="padding:2rem 0;">
              <i class="fa-solid fa-clock-rotate-left empty-state-icon"></i>
              <h4>No Search History</h4>
              <p>You haven't searched for anything yet.</p>
            </div>`;
          return;
        }

        tl.innerHTML = logs.map(h => `
          <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div class="timeline-content" onclick="window.location.href='results.html?q=${encodeURIComponent(h.query || h.searchQuery)}'">
              <div class="timeline-query">${h.searchQuery || h.query}</div>
              <div class="timeline-meta">
                <span><i class="fa-solid fa-calendar-day"></i> ${formatDateTime(h.searchedAt)}</span>
                <span><i class="fa-solid fa-file-lines"></i> ${h.resultCount || 0} results</span>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        tl.innerHTML = `<div class="empty-state"><p style="color:var(--danger)">${err.message}</p></div>`;
      }
    }

    async function loadKeywords() {
      const list = document.getElementById('keywordsList');
      try {
        const words = await history.getKeywords();
        if (!words || words.length === 0) {
          list.innerHTML = '<span style="color:var(--text-dim);font-size:.85rem;">No keywords yet.</span>';
          return;
        }
        list.innerHTML = words.map(w => {
            const kw = typeof w === 'string' ? w : (w.keyword || w);
            return `<a href="results.html?q=${encodeURIComponent(kw)}" class="keyword-tag"><i class="fa-solid fa-hashtag" style="font-size:.7rem;"></i> ${kw}</a>`;
        }).join('');
      } catch {
        list.innerHTML = '<span style="color:var(--danger);font-size:.85rem;">Error loading keywords</span>';
      }
    }

    document.getElementById('clearHistoryBtn')?.addEventListener('click', async () => {
      if (!confirm('Are you sure you want to clear your entire search history?')) return;
      try {
        await history.clear();
        showToast('History cleared', 'success');
        loadData();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
